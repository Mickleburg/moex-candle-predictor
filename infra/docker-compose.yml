# One-command bring-up from a clean clone:
#   cp .env.example .env   # fill in secrets (TELEGRAM_BOT_TOKEN + BOT_ADMIN_CHAT_IDS for the bot)
#   docker compose -f infra/docker-compose.yml up -d --build
#
# TWO services off ONE image (built once, tagged moex-agent:latest):
#   * agent — the scheduler daemon (EOD/pre-open cycle + dead-man's-switch).
#   * bot   — the Telegram monitoring poller (read-only).
# One TELEGRAM_BOT_TOKEN, no conflict: the agent only sendMessage (push), the bot is the SINGLE
# getUpdates long-poller. They are SEPARATE processes/containers (not one event-loop), so the
# APScheduler trigger and the poller never block each other.
#
# `restart: unless-stopped` is the process supervisor (auto-restart on crash/reboot). The shared
# ./data bind-mount persists the SQLite state store, cycle results, logs, parquet candles AND the
# bot's managed allowlist — the bot opens the agent state DB mode=ro from the same volume.
services:
  agent:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: moex-agent:latest
    container_name: moex-agent
    env_file:
      - ../.env
    environment:
      TZ: Europe/Moscow
    volumes:
      - ../data:/app/data
    restart: unless-stopped
    # The scheduler daemon (EOD + pre-open + dead-man's-switch). Override `command:` with
    # e.g. ["run-eod","--force"] for a one-shot manual cycle.
    command: ["scheduler"]
    healthcheck:
      # liveness: the agent process answers `status` (state store reachable).
      test: ["CMD", "python", "-m", "agent.src.cli", "status"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 30s

  bot:
    image: moex-agent:latest        # reuse the agent image (built by the `agent` service)
    container_name: moex-bot
    depends_on:
      - agent                       # ensure the image is built + state dir exists first
    env_file:
      - ../.env
    environment:
      TZ: Europe/Moscow
    volumes:
      - ../data:/app/data
    restart: unless-stopped
    # The Telegram monitoring bot — the SINGLE getUpdates poller (read-only). Overrides the image
    # entrypoint (which is the agent CLI) to run the bot instead. Needs TELEGRAM_BOT_TOKEN +
    # BOT_ADMIN_CHAT_IDS in .env, else it fail-closes (refuses to start) by design.
    entrypoint: ["python", "-m", "bot"]
    command: []
    healthcheck:
      # liveness: the bot package + its agent-config wiring import cleanly.
      test: ["CMD", "python", "-c", "import bot.src.app"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 20s
